# Primary comparison — all three YOLO generations at s-scale on VisDrone.
# Same cleaned data, same schedule: isolates the architecture variable.
# VisDrone: 8,633 imgs / 446,585 boxes; all 8 classes healthy.
dataset: visdrone
models: [yolov8s-obb, yolo11s-obb, yolo26s-obb]
epochs: 150
imgsz: 1280
batch: -1
train_kwargs:
  patience: 30
  cos_lr: true
  close_mosaic: 10
